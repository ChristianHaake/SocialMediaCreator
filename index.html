<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Erstelle fiktive digitale Kommunikationsformate lokal im Browser."
    />
    <meta name="theme-color" content="#245dcc" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SocialMediaCreator" />
    <title>SocialMediaCreator</title>
    <script>
      // Globale Darstellung vor dem ersten Paint setzen (kein Theme-Flash).
      (function () {
        try {
          var t = localStorage.getItem("smc:appTheme");
          if (t === "dim" || t === "dark")
            document.documentElement.setAttribute("data-app-theme", t);
          var f = localStorage.getItem("smc:fontScale");
          if (f === "large" || f === "xlarge")
            document.documentElement.setAttribute("data-font", f);
        } catch (e) {
          /* localStorage blockiert — Default (hell/normal) */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Cloudflare Web Analytics -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "ca298c69e4054c05a4463c41f11f88e3"}'
    ></script>
    <!-- End Cloudflare Web Analytics -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
